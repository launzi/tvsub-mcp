[project]
name = "tvsub-mcp"
version = "0.3.0"
description = "Apple TV.app subtitle overlay with Anthropic API, Claude subscription, and ChatGPT subscription translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.6,<2",
  "anthropic>=0.117",
]

[project.urls]
Homepage = "https://youngji.kim/tvsub"
Repository = "https://github.com/launzi/tvsub-mcp"
Issues = "https://github.com/launzi/tvsub-mcp/issues"

[project.scripts]
tvsub-mcp = "tvsub_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tvsub_mcp*"]
